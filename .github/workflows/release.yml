name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        # Both envs in ONE pio invocation: a second `pio run` can wipe the whole
        # .pio/build tree, deleting firmware.bin before the upload below.
        run: pio run -e gh_release -e readwise

      - name: Stage release assets
        # The readwise variant asks OTA for "firmware-readwise.bin" (see
        # OTA_FIRMWARE_ASSET_NAME), so it must be published under that name —
        # both envs build a file called firmware.bin.
        run: |
          set -euo pipefail
          cp .pio/build/readwise/firmware.bin firmware-readwise.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            firmware-readwise.bin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          firmware=".pio/build/gh_release/firmware.bin"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$firmware" firmware-readwise.bin --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$firmware" firmware-readwise.bin \
              --verify-tag \
              --generate-notes \
              --title "CrossPoint Reader $GITHUB_REF_NAME"
          fi
